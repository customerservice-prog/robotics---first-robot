[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ribitics-robot"
version = "0.3.0"
description = "Upgradeable local-first robot brain, voice, vision, spatial safety, memory, and ESP32 motor bridge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
voice = [
  "sounddevice>=0.5,<1",
  "vosk>=0.3.45,<1",
]
vision = [
  "opencv-python-headless>=4.10,<5",
]
robot = [
  "sounddevice>=0.5,<1",
  "vosk>=0.3.45,<1",
  "opencv-python-headless>=4.10,<5",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
