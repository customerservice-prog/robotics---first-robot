[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ribitics-robot"
version = "0.1.0"
description = "Upgradeable local-first robot brain, dashboard, memory, voice, and ESP32 motor bridge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
